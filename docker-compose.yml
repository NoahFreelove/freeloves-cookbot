# Docker Compose for FreelovesCookBot — one self-hosted container.
#
# Persistent data lives in two named volumes:
#   - cookbot_db      -> /data : SQLite database (cookbot.db + its WAL files).
#                        The Data Protection key ring is stored inside cookbot.db,
#                        so this single volume holds everything worth backing up.
#   - cookbot_uploads -> /app/wwwroot/uploads : user-uploaded recipe photos.
#
# restart: on-failure with healthcheck retries: 3 — the container exits visibly
# after 3 failed boots instead of silently restart-looping forever.
# start_period: 30s gives the first boot time to run DB migrations and one-time
# setup before the healthcheck starts counting failures.

services:
  cookbot:
    # Pulls the prebuilt image published by .github/workflows/docker-publish.yml.
    # No source checkout or .NET SDK needed — `docker compose up -d` just works.
    # To build from local source instead, uncomment `build: .` below (and run
    # `docker compose up -d --build`).
    image: ghcr.io/noahfreelove/freeloves-cookbot:latest
    # build: .
    container_name: cookbot
    ports:
      - "${COOKBOT_PORT:-7000}:7000"
    environment:
      ASPNETCORE_URLS: http://+:7000
      ConnectionStrings__DefaultConnection: "Data Source=/data/cookbot.db"
      COOKBOT_PORT: "7000"
      # Optional: a host-wide Anthropic API key used as a fallback. Leave it unset
      # to rely on per-user keys entered in the app's Profile page.
      # CookBot__AnthropicApiKey: ""
    volumes:
      - cookbot_db:/data
      - cookbot_uploads:/app/wwwroot/uploads
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  cookbot_db: {}
  cookbot_uploads: {}
