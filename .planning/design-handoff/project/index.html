<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CookBot · Redesign</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/cooking.jsx"></script>
<script type="text/babel" src="screens/ai-chat.jsx"></script>
<script type="text/babel" src="screens/recipe-view.jsx"></script>
<script type="text/babel" src="screens/recipe-editor.jsx"></script>
<script type="text/babel" src="screens/cookbook-list.jsx"></script>
<script type="text/babel" src="screens/pantry.jsx"></script>
<script type="text/babel" src="screens/grocery-phone.jsx"></script>
<script type="text/babel" src="screens/prompt-builder.jsx"></script>
<script type="text/babel" src="screens/v2.jsx"></script>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "accent": "orange",
  "density": "comfy",
  "aiOff": false,
  "cookHero": "adaptive"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAKS);

  // Apply accent + density on the root via data-attrs the CSS reads.
  React.useEffect(() => {
    document.documentElement.setAttribute('data-accent', t.accent);
    document.documentElement.setAttribute('data-density', t.density);
  }, [t.accent, t.density]);

  // Tablet frame for cooking mode (1024×720)
  const Tablet = ({ children }) => (
    <div style={{
      width: 1024, height: 720,
      border: '14px solid #1a1410', borderRadius: 36,
      background: '#000', overflow: 'hidden',
      boxShadow: '0 30px 80px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.04)',
      position: 'relative'
    }}>
      <div style={{ width: '100%', height: '100%' }}>{children}</div>
    </div>
  );

  // Phone frame (390×844)
  const Phone = ({ children }) => (
    <div style={{
      width: 390, height: 760,
      border: '10px solid #1a1410', borderRadius: 44,
      background: '#000', overflow: 'hidden',
      boxShadow: '0 30px 80px rgba(0,0,0,.18)',
      position: 'relative'
    }}>
      {children}
    </div>
  );

  return (
    <>
      <DesignCanvas>
        <DCSection id="01-home" title="01 · Home dashboard" subtitle="Earns its space — pantry-aware suggestions, recently cooked, queue. Desktop · 1280×860.">
          <DCArtboard id="home-a" label="A · warm cream — orange chrome" width={1280} height={860}>
            <HomeDashboard aiOff={t.aiOff}/>
          </DCArtboard>
          <DCArtboard id="home-b" label="B · editorial — terracotta" width={1280} height={860}>
            <HomeV2 />
          </DCArtboard>
        </DCSection>

        <DCSection id="02-cooking" title="02 · Cooking Mode" subtitle="Tablet · adaptive hero. Timer when running, step text when idle. Always-on ingredient rail.">
          <DCArtboard id="cook-a" label={`A · adaptive (timer-running)`} width={1056} height={752}>
            <Tablet><CookingMode heroMode={t.cookHero} timerRunning={true}/></Tablet>
          </DCArtboard>
          <DCArtboard id="cook-b" label="B · adaptive (idle — step is hero)" width={1056} height={752}>
            <Tablet><CookingMode heroMode={t.cookHero} timerRunning={false}/></Tablet>
          </DCArtboard>
          <DCArtboard id="cook-c" label="C · v2 skin" width={1056} height={752}>
            <Tablet><CookingV2 heroMode={t.cookHero} timerRunning={true}/></Tablet>
          </DCArtboard>
        </DCSection>

        <DCSection id="03-ai" title="03 · AI Chat" subtitle="Streaming text builds a recipe card live. Chat is secondary; the canvas is the artifact.">
          <DCArtboard id="ai-a" label="A · live recipe canvas" width={1280} height={860}>
            <AiChat />
          </DCArtboard>
          <DCArtboard id="ai-b" label="B · v2 skin" width={1280} height={860}>
            <AiChatV2 />
          </DCArtboard>
        </DCSection>

        <DCSection id="04-recipe" title="04 · Recipe View" subtitle="Editorial. Display title, hanging numerals, sticky ingredient sidebar, scale prominent.">
          <DCArtboard id="rv-a" label="A · editorial" width={1280} height={1100}>
            <RecipeView />
          </DCArtboard>
          <DCArtboard id="rv-b" label="B · v2 skin" width={1280} height={1100}>
            <RecipeViewV2 />
          </DCArtboard>
        </DCSection>

        <DCSection id="05-editor" title="05 · Recipe Editor" subtitle="Chip composer with no special syntax. Ingredient chips and timer chips inline in step text.">
          <DCArtboard id="ed-a" label="A · author flow" width={1280} height={1100}>
            <RecipeEditor />
          </DCArtboard>
        </DCSection>

        <DCSection id="06-cookbooks" title="06 · Cookbooks" subtitle="Scannable. Each book gets a generated thumbnail collage from its recipes.">
          <DCArtboard id="cb-a" label="A · grid" width={1280} height={860}>
            <CookbookList />
          </DCArtboard>
        </DCSection>

        <DCSection id="07-pantry" title="07 · Pantry" subtitle="Categorized stock with status chips. AI populate is hidden when AI is off.">
          <DCArtboard id="pa-a" label="A · stock view" width={1280} height={1000}>
            <Pantry aiOff={t.aiOff}/>
          </DCArtboard>
        </DCSection>

        <DCSection id="08-grocery" title="08 · Grocery List" subtitle="Phone-first, big tap targets, organized by aisle.">
          <DCArtboard id="gr-a" label="A · phone — by aisle" width={410} height={780}>
            <Phone><GroceryListPhone /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="09-prompt" title="09 · Prompt Builder" subtitle="Generate a copy-pasteable system prompt. Mono panel; configurable left rail.">
          <DCArtboard id="pr-a" label="A · system prompt" width={1280} height={860}>
            <PromptBuilder aiOff={t.aiOff}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Accent" value={t.accent}
          options={[{value:'orange',label:'orange'},{value:'terracotta',label:'terracotta'},{value:'sage',label:'sage'}]}
          onChange={(v) => setTweak('accent', v)} />
        <TweakRadio label="Density" value={t.density}
          options={[{value:'comfy',label:'comfy'},{value:'compact',label:'compact'}]}
          onChange={(v) => setTweak('density', v)} />

        <TweakSection label="AI" />
        <TweakToggle label="Hide AI surfaces" value={t.aiOff}
          onChange={(v) => setTweak('aiOff', v)} />

        <TweakSection label="Cooking Mode" />
        <TweakRadio label="Hero" value={t.cookHero}
          options={[
            {value:'adaptive',label:'adaptive'},
            {value:'timer',label:'timer'},
            {value:'step',label:'step'},
            {value:'ing',label:'ingredients'},
          ]}
          onChange={(v) => setTweak('cookHero', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
